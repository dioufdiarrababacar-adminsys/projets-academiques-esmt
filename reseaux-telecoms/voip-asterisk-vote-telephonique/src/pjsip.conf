; Extrait de /etc/asterisk/pjsip.conf : transport et deux postes de démonstration.
; Remplacer chaque CHANGER_MOI par un mot de passe aléatoire long (openssl rand -base64 18).
; Ne jamais utiliser un mot de passe de type 123456 : un poste SIP exposé est attaqué en quelques heures.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; En réseau local, external_media_address et external_signaling_address ne sont pas nécessaires.

; === Utilisateur 101 ===
[101]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
auth=101-auth
aors=101

[101-auth]
type=auth
auth_type=userpass
username=101
password=CHANGER_MOI

[101]
type=aor
max_contacts=1

; === Utilisateur 102 ===
[102]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
auth=102-auth
aors=102

[102-auth]
type=auth
auth_type=userpass
username=102
password=CHANGER_MOI

[102]
type=aor
max_contacts=1
