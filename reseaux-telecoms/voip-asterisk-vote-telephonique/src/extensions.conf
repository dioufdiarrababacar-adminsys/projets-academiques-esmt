; Extrait de /etc/asterisk/extensions.conf : le centre d'appel de vote.
; Version corrigée après revue de sécurité (voir le README du projet).

[globals]
; Même valeur que « token » dans config.ini. Fichier lisible par l'utilisateur asterisk uniquement.
VOTE_TOKEN=CHANGER_MOI

[from-internal]
include => centre_appel

[centre_appel]
; Appels entre postes
exten => 101,1,Dial(PJSIP/101)
exten => 102,1,Dial(PJSIP/102)

; Menu de vote : touche 1 ou 2 dans les 5 secondes
exten => 200,1,Answer()
 same => n,Wait(1)
 same => n,Background(custom_vote)
 same => n,WaitExten(5)
 same => n,Hangup()

; Touche 1 : Modou Lô (message vote_modou_lo)
exten => 1,1,Gosub(enregistrer,s,1(1,vote_modou_lo))
 same => n,Hangup()

; Touche 2 : Balla Gaye (message vote_balla_gaye)
exten => 2,1,Gosub(enregistrer,s,1(2,vote_balla_gaye))
 same => n,Hangup()

; Touche invalide ou délai dépassé
exten => i,1,Hangup()
exten => t,1,Hangup()

; Sous-routine : envoie le vote à la page PHP. ARG1 = touche, ARG2 = message de confirmation.
; ${FILTER(0-9,...)} ne garde que les chiffres du numéro appelant : un appelant SIP peut mettre
; n'importe quel texte dans son identifiant, et il serait sinon recopié tel quel dans la commande shell.
[enregistrer]
exten => s,1,Set(VOTANT=${FILTER(0-9,${CALLERID(num)})})
 same => n,GotoIf($["${VOTANT}" = ""]?refus)
 same => n,System(curl -sf -m 5 -X POST -H "X-Vote-Token: ${VOTE_TOKEN}" --data-urlencode "touche=${ARG1}" --data-urlencode "votant=${VOTANT}" http://127.0.0.1/enregistrervote.php)
 same => n,GotoIf($["${SYSTEMSTATUS}" != "SUCCESS"]?refus)
 same => n,Playback(${ARG2})                 ; message de confirmation propre au candidat
 same => n,Return()
 same => n(refus),Playback(beep)             ; vote refusé (déjà voté ou erreur) : à remplacer par un message enregistré
 same => n,Return()
