; Copier vers /etc/asterisk-vote/config.ini (hors du dossier web), propriétaire root, groupe du serveur web, mode 640.
; Ne jamais committer le vrai fichier.
dsn = "mysql:host=127.0.0.1;dbname=asteriskcdrdb;charset=utf8mb4"
utilisateur = "votes_app"
mot_de_passe = "CHANGER_MOI"
; Secret partagé avec le dialplan (variable VOTE_TOKEN). Générer par exemple avec : openssl rand -hex 32
token = "CHANGER_MOI"
